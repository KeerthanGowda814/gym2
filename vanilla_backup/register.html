<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register as a member or apply as an elite coach at Apex Athletics.">
  <title>Portal Register | Apex Athletics</title>
  
  <!-- Preconnect to Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- Decorative background glows -->
  <div class="decor-glow ring-1"></div>
  <div class="decor-glow ring-2"></div>

  <!-- Back link to website home -->
  <a href="index.html" class="portal-back-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Return to Main Site
  </a>

  <!-- Main Card Container -->
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- REGISTRATION PANEL -->
      <div class="card-panel">
        <div class="portal-header">
          <div class="logo">
            APEX<span>ATHLETICS</span>
            <div class="logo-dot"></div>
          </div>
          <h2>Create Account</h2>
          <p>Join our premium strength club to unleash your limits.</p>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="role-tabs">
          <button class="role-tab active" data-type="member" id="reg-tab-member">Member</button>
          <button class="role-tab" data-type="trainer" id="reg-tab-trainer">Trainer</button>
        </div>

        <!-- ==========================================
             A. MEMBER REGISTRATION FORM
             ========================================== -->
        <form id="register-member-form" novalidate>
          <!-- Full Name -->
          <div class="form-group">
            <label for="mem-name" class="form-label">Full Name</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </span>
              <input type="text" id="mem-name" class="form-input" placeholder="e.g. John Doe" required>
            </div>
            <div class="error-feedback" id="mem-name-error"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="mem-email" class="form-label">Email Address</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </span>
              <input type="email" id="mem-email" class="form-input" placeholder="john@example.com" required autocomplete="email">
            </div>
            <div class="error-feedback" id="mem-email-error"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="mem-password" class="form-label">Password</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </span>
              <input type="password" id="mem-password" class="form-input pass-input" placeholder="••••••••" required autocomplete="new-password">
              <button type="button" class="toggle-password-btn eye-toggle" aria-label="Toggle Password Visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
            <div class="error-feedback" id="mem-password-error"></div>
          </div>

          <!-- Age -->
          <div class="form-group">
            <label for="mem-age" class="form-label">Age</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </span>
              <input type="number" id="mem-age" class="form-input" placeholder="e.g. 25" min="12" max="100" required>
            </div>
            <div class="error-feedback" id="mem-age-error"></div>
          </div>

          <!-- Mobile Number -->
          <div class="form-group">
            <label for="mem-phone" class="form-label">Mobile Number</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
              </span>
              <input type="tel" id="mem-phone" class="form-input" placeholder="e.g. (555) 000-0000" required>
            </div>
            <div class="error-feedback" id="mem-phone-error"></div>
          </div>

          <!-- Options -->
          <div class="form-options" style="margin-bottom: 2rem;">
            <label class="remember-me-label">
              <input type="checkbox" id="mem-terms" required>
              <span class="checkbox-box"></span>
              I accept user terms & conditions
            </label>
            <div class="error-feedback" id="mem-terms-error" style="width: 100%;"></div>
          </div>

          <!-- Submit -->
          <button type="submit" class="glow-btn login-submit-btn" id="mem-submit-btn">
            Create Member Account
          </button>
        </form>

        <!-- ==========================================
             B. TRAINER APPLICATION FORM
             ========================================== -->
        <form id="register-trainer-form" novalidate style="display: none;">
          <!-- Full Name -->
          <div class="form-group">
            <label for="trn-name" class="form-label">Full Name</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </span>
              <input type="text" id="trn-name" class="form-input" placeholder="e.g. Marcus Vance" required>
            </div>
            <div class="error-feedback" id="trn-name-error"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="trn-email" class="form-label">Email Address</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </span>
              <input type="email" id="trn-email" class="form-input" placeholder="coach@apex.com" required autocomplete="email">
            </div>
            <div class="error-feedback" id="trn-email-error"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="trn-password" class="form-label">Password</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </span>
              <input type="password" id="trn-password" class="form-input pass-input" placeholder="••••••••" required autocomplete="new-password">
              <button type="button" class="toggle-password-btn eye-toggle" aria-label="Toggle Password Visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
            <div class="error-feedback" id="trn-password-error"></div>
          </div>

          <!-- Specialty -->
          <div class="form-group">
            <label for="trn-specialty" class="form-label">Coaching Specialization</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
              </span>
              <select id="trn-specialty" class="form-input" style="padding-left: 2.8rem;" required>
                <option value="strength">Strength & Power Conditioning</option>
                <option value="hiit">HIIT & Cardiovascular</option>
                <option value="yoga">Yoga & Mobility Flow</option>
                <option value="combat">Combat & Boxing</option>
              </select>
            </div>
          </div>

          <!-- Certifications details text -->
          <div class="form-group">
            <label for="trn-certs" class="form-label">Certifications / Years of Experience</label>
            <textarea id="trn-certs" class="form-input" rows="2" placeholder="e.g. CSCS Certified, 5+ Years Active Coaching" style="padding-left: 1rem;" required></textarea>
            <div class="error-feedback" id="trn-certs-error"></div>
          </div>

          <!-- Options -->
          <div class="form-options" style="margin-bottom: 2rem;">
            <label class="remember-me-label">
              <input type="checkbox" id="trn-terms" required>
              <span class="checkbox-box"></span>
              I accept staff credentials terms
            </label>
            <div class="error-feedback" id="trn-terms-error" style="width: 100%;"></div>
          </div>

          <!-- Submit -->
          <button type="submit" class="glow-btn login-submit-btn" id="trn-submit-btn">
            Submit Coach Application
          </button>
        </form>

        <div class="portal-footer">
          <p style="margin-bottom: 0.8rem;">Already have an account? <a href="login.html" style="color: var(--accent-volt); font-weight: 700; text-decoration: underline;">Sign In</a></p>
          <p>Apex Athletics club access portals. Unauthorized entry is logged.</p>
        </div>
      </div>

      <!-- SUCCESS STATE OVERLAY -->
      <div class="forgot-success-state" id="reg-success-state">
        <div class="success-icon-wrapper" style="border-color: var(--accent-volt); color: var(--accent-volt); background: rgba(198, 255, 0, 0.05); box-shadow: var(--glow-volt);">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h3 id="reg-success-title">Profile Created</h3>
        <p id="reg-success-message">Syncing simulated user database... redirecting to secure login interface.</p>
      </div>

    </div>
  </div>

  <!-- Shared Auth script, then local controller -->
  <script src="auth.js"></script>
  <script src="register.js"></script>
</body>
</html>
